name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-independent:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$files"
            exit 1
          fi

      - name: Test
        run: go test ./... -count=1

      - name: Test with race detector
        run: go test -race ./... -count=1

      - name: Collect coverage
        run: |
          go test ./... -count=1 -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: hpc-model-go-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  test-local-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hpc-model-go
        uses: actions/checkout@v4
        with:
          path: hpc-model-go

      - name: Checkout slurm-client-go
        uses: actions/checkout@v4
        with:
          repository: perillaroc/slurm-client-go
          path: slurm-client-go

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: slurm-client-go/go.mod

      - name: Create local Go workspace
        run: go work init ./hpc-model-go ./slurm-client-go

      - name: Test CLI with local library
        run: go -C slurm-client-go test ./... -count=1

      - name: Test CLI and local library with race detector
        run: go -C slurm-client-go test -race ./... -count=1

      - name: Build CLI with local library
        run: go -C slurm-client-go build ./...
